name: Build SAO UI Mod

on:
  push:
    branches: [ "1.16.5" ]
  workflow_dispatch:   # permet de lancer manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17 (compatible ForgeGradle 5)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache Gradle pour accélérer les prochaines compilations
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Rendre le wrapper Gradle exécutable
      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      # 5. Compiler !
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"

      # 6. Upload le .jar compilé comme artefact téléchargeable
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: saoui-1.16.5-SAO-FX
          path: build/libs/*.jar
          retention-days: 30
